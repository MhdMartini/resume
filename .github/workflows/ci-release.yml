name: ci-release
description: Release.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        description: 'Perform a dry run?'
        type: boolean
        required: false
        default: false

jobs:
  versioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pandoc and xelatex
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Build PDF
        run: uv run scripts/build_pdf.py

      - name: Update version in pyproject.toml
        shell: python
        run: |
          import os
          from datetime import date
          import re

          # Re-implementing simplified toml update to avoid external dependency for just one field
          pyproject_path = 'pyproject.toml'
          today = date.today()
          new_version = f'{today.year}.{today.month}.{today.day}'

          with open(pyproject_path, 'r') as f:
              content = f.read()

          # Replace version = "..." with the new date-based version
          new_content = re.sub(r'version = ".*"', f'version = "{new_version}"', content)

          with open(pyproject_path, 'w') as f:
              f.write(new_content)

          print(f'Updated version to {new_version} in pyproject.toml')

      - name: Publish release
        if: inputs.dry-run == false
        run: |
          echo "Publishing release with version ${{ inputs.version }}"          
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add pyproject.toml docs/assets/resume.pdf
          if [[ -n "$(git status --cached --porcelain)" ]]; then
            git commit -m "Release ${{ inputs.version }}: bump version, update PDF"
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi
